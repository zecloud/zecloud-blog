name: CI

on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [build-application]
  workflow_dispatch:
      
# on: [push, repository_dispatch]
#   branches:
#     - main
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js for use with actions
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Install dependencies
      run: yarn add sharp --ignore-engines
    - name: Build Gatsby Site
      uses: zecloud/gatsby-cli-github-action@master
      env:
          GATSBY_PORTAL_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_CONTENT_API_KEY: ${{ secrets.GHOST_CONTENT_API_KEY }}
      with:
        gatsby-arg: build
    - name: Deploy
      uses: cpina/github-action-push-to-another-repository@v1.7.3
      env:
        API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
      with:
        source-directory: public
        destination-github-username: zecloud
        destination-repository-name: zecloud.github.io
        target-branch: master
    
